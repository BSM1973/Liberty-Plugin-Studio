name: Pedal Legends Native macOS (AU + VST3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'PedalLegends-NativeBridge/**'
      - '.github/workflows/pedal-legends-native-bridge.yml'
  pull_request:
    paths:
      - 'PedalLegends-NativeBridge/**'
      - '.github/workflows/pedal-legends-native-bridge.yml'

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JUCE 8.0.10
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure arm64
        run: |
          cmake -S PedalLegends-NativeBridge -B "$RUNNER_TEMP/pedal-build" \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build AU and VST3
        run: cmake --build "$RUNNER_TEMP/pedal-build" --config Release --target PedalLegendsBridge_AU PedalLegendsBridge_VST3 -j 2
      - name: Inspect new audio plugin identity
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/pedal-build" -type d \( -name '*.component' -o -name '*.vst3' \) -print
          AU=$(find "$RUNNER_TEMP/pedal-build" -type d -name '*.component' -print -quit)
          test -n "$AU"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$AU/Contents/Info.plist" | grep -Fx LbMS
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:name' "$AU/Contents/Info.plist" | grep -F 'Liberty Music Software'
      - name: Package and sign locally (ad hoc, not notarised)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pedal-artifacts"
          while IFS= read -r -d '' dir; do
            codesign --force --deep --sign - "$dir"
            ditto "$dir" "$RUNNER_TEMP/pedal-artifacts/$(basename "$dir")"
          done < <(find "$RUNNER_TEMP/pedal-build" -type d \( -name '*.component' -o -name '*.vst3' \) -print0)
      - name: Upload native builds
        uses: actions/upload-artifact@v4
        with:
          name: PedalLegends-Native-AU-VST3-arm64
          path: ${{ runner.temp }}/pedal-artifacts/
          if-no-files-found: error
