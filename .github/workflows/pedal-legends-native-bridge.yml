name: Pedal Legends Native macOS (AU + VST3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'PedalLegends-NativeBridge/**'
      - '.github/workflows/pedal-legends-native-bridge.yml'
  pull_request:
    paths:
      - 'PedalLegends-NativeBridge/**'
      - '.github/workflows/pedal-legends-native-bridge.yml'

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JUCE 8.0.10
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure arm64
        run: |
          cmake -S PedalLegends-NativeBridge -B "$RUNNER_TEMP/pedal-build" \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build AU and VST3
        run: cmake --build "$RUNNER_TEMP/pedal-build" --config Release --target PedalLegendsBridge_AU PedalLegendsBridge_VST3 -j 2
      - name: Inspect new audio plugin identity
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/pedal-build" -type d \( -name '*.component' -o -name '*.vst3' \) -print
          AU=$(find "$RUNNER_TEMP/pedal-build" -type d -name '*.component' -print -quit)
          test -n "$AU"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$AU/Contents/Info.plist" | grep -Fx LbMS
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:name' "$AU/Contents/Info.plist" | grep -F 'Liberty Music Software'
      - name: Package and sign locally (ad hoc, not notarised)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pedal-artifacts"
          while IFS= read -r -d '' dir; do
            codesign --force --deep --sign - "$dir"
            ditto "$dir" "$RUNNER_TEMP/pedal-artifacts/$(basename "$dir")"
          done < <(find "$RUNNER_TEMP/pedal-build" -type d \( -name '*.component' -o -name '*.vst3' \) -print0)
      - name: Validate new AU with auval (original DSP not installed on runner)
        shell: bash
        run: |
          set -euo pipefail
          AU=$(find "$RUNNER_TEMP/pedal-artifacts" -type d -name '*.component' -print -quit)
          test -n "$AU"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$AU" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$AU")"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          /usr/bin/auval -v aufx PdLg LbMS
      - name: Build system installer PKG and verify layout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pedal-pkg-root"
          SCRIPTS="$RUNNER_TEMP/pedal-pkg-scripts"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Library/Audio/Plug-Ins/VST3" "$SCRIPTS" \
            "$ROOT/Library/Application Support/Liberty Music Software/Pedal Legends/UI"
          node --check PedalLegends-NativeBridge/Installer/lms-layout-v6.js
          # Every historical pedal must carry one distinct technical translation.
          node PedalLegends-NativeBridge/Installer/check-40-technical-fr.js

          /usr/bin/iconv -f UTF-8 -t UTF-8 PedalLegends-NativeBridge/Installer/lms-layout-v6.js >/dev/null
          /usr/bin/iconv -f UTF-8 -t UTF-8 PedalLegends-NativeBridge/Installer/lms-layout-v6.css >/dev/null
          cp PedalLegends-NativeBridge/Installer/lms-layout-v6.js \
            "$ROOT/Library/Application Support/Liberty Music Software/Pedal Legends/UI/lms-layout-v6.js"
          cp PedalLegends-NativeBridge/Installer/lms-layout-v6.css \
            "$ROOT/Library/Application Support/Liberty Music Software/Pedal Legends/UI/lms-layout-v6.css"
          AU="$RUNNER_TEMP/pedal-artifacts/Pedal Legends.component"
          VST3="$RUNNER_TEMP/pedal-artifacts/Pedal Legends.vst3"
          test -d "$AU" && test -d "$VST3"
          ditto "$AU" "$ROOT/Library/Audio/Plug-Ins/Components/Pedal Legends.component"
          ditto "$VST3" "$ROOT/Library/Audio/Plug-Ins/VST3/Pedal Legends.vst3"
          cp PedalLegends-NativeBridge/Installer/postinstall "$SCRIPTS/postinstall"
          chmod +x "$SCRIPTS/postinstall"
          /bin/bash -n "$SCRIPTS/postinstall"
          /usr/bin/pkgbuild --root "$ROOT" --install-location / --scripts "$SCRIPTS" \
            --identifier com.libertymusicsoftware.pedallegends.nativebridge.installer \
            --version 1.0.5 "$RUNNER_TEMP/pedal-artifacts/Pedal-Legends-Liberty-Music-Software-Systeme.pkg"
          /usr/sbin/pkgutil --payload-files "$RUNNER_TEMP/pedal-artifacts/Pedal-Legends-Liberty-Music-Software-Systeme.pkg" | tee "$RUNNER_TEMP/pedal-pkg-files.txt"
          grep -F 'Library/Audio/Plug-Ins/Components/Pedal Legends.component/Contents/Info.plist' "$RUNNER_TEMP/pedal-pkg-files.txt"
          grep -F 'Library/Audio/Plug-Ins/VST3/Pedal Legends.vst3/Contents/Info.plist' "$RUNNER_TEMP/pedal-pkg-files.txt"
          grep -F 'Library/Application Support/Liberty Music Software/Pedal Legends/UI/lms-layout-v6.js' "$RUNNER_TEMP/pedal-pkg-files.txt"
          grep -F 'Library/Application Support/Liberty Music Software/Pedal Legends/UI/lms-layout-v6.css' "$RUNNER_TEMP/pedal-pkg-files.txt"
      - name: Upload native builds
        uses: actions/upload-artifact@v4
        with:
          name: PedalLegends-Native-AU-VST3-arm64
          path: ${{ runner.temp }}/pedal-artifacts/
          if-no-files-found: error
